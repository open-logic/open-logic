name: Setup Environment Action
description: 'Setup the environment for any Open Logic jobs'

inputs:
  os:
    description: 'The runner OS'
    required: true
  ghdl:
    description: 'Install GHDL (true/false)'
    required: false
    default: 'false'
  nvc:
    description: 'Install NVC (true/false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    #Python Setup (Cached)
    - name: Setup python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install Python Requiremetns
      shell: bash
      run: |
        pip install "setuptools<70" setuptools_scm wheel
        pip install --no-build-isolation -r ./.github/workflows/requirements.txt
    #Setup GHDL (prebuilt mcode release, only requires the GNAT runtime)
    #.. apt-get update is only executed if the install fails due to outdated package lists
    - name: Install GHDL
      if: inputs.ghdl == 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends libgnat-9 || \
          { sudo apt-get update && sudo apt-get install -y --no-install-recommends libgnat-9; }
        mkdir -p ~/ghdl
        wget -q https://github.com/ghdl/ghdl/releases/download/v4.1.0/ghdl-gha-ubuntu-20.04-mcode.tgz
        tar zxf ghdl-gha-ubuntu-20.04-mcode.tgz -C ~/ghdl
        ~/ghdl/bin/ghdl --version
        echo "$HOME/ghdl/bin" >> $GITHUB_PATH
    #Setup NVC (prebuilt Debian package from the NVC release)
    #.. apt-get update is only executed if the install fails due to outdated package lists
    - name: Install NVC
      if: inputs.nvc == 'true'
      shell: bash
      run: |
        wget -q -O /tmp/nvc.deb https://github.com/nickg/nvc/releases/download/r1.19.0/nvc_1.19.0-1_amd64_ubuntu-24.04.deb
        sudo apt-get install -y --no-install-recommends /tmp/nvc.deb || \
          { sudo apt-get update && sudo apt-get install -y --no-install-recommends /tmp/nvc.deb; }
        nvc --version
