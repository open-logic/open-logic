name: Coverage Simulation
run-name: ${{ github.actor }} triggered Coverage simulation

# Set the permissions for the workflow
permissions:
  checks: write
  pull-requests: write

#Set Triggers
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 10 * *'
  
#Jobs  
jobs:
  start-instance:
    runs-on: ubuntu-latest
    steps:
      #General Setup
      - name: Checkout actions
        uses: actions/checkout@v5
      #Start AWS Instance
      - name: Start Instance
        uses: ./.github/actions/start-aws-instance
        with:
          region: eu-central-1
          aws_secret_access_key: ${{ secrets.AWS_SECRET }}
          aws_access_key_id: ${{ secrets.AWS_KEY }}
          aws_build_ami_id: ${{ vars.AWS_BUILD_AMI_ID }}
          aws_instance_type: ${{ vars.AWS_INSTANCE_TYPE }}

  simulation:
    runs-on: [self-hosted, aws]
    timeout-minutes: 720
    needs: start-instance
    steps:
      # Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: true
      # Setup python
      - name: Setup Python
        run : |
          source $LOCAL_TOOLS
          cd .github/workflows
          pip install "setuptools<70" setuptools_scm wheel
          pip install --no-build-isolation -r requirements.txt
      # Run simulation
      - name: Run Simulation
        run: |
          source $LOCAL_TOOLS
          # TEMPORARY: Diagnostics for "execv: Argument list too long"
          echo "ARG_MAX: $(getconf ARG_MAX)"
          echo "Stack soft/hard: $(ulimit -s) / $(ulimit -Hs)"
          echo "Environment size: $(env | wc -c)"
          echo "Longest environment variables:"
          echo "ARG_MAX: $(getconf ARG_MAX)"
          echo "Stack soft/hard: $(ulimit -s) / $(ulimit -Hs)"
          echo "Environment size: $(env | wc -c)"          
          cd ./sim
          python3 -u ./run.py --modelsim --coverage
      # TEMPORARY: Post-fail diagnosis for "execv: Argument list too long"
      - name: Post-Fail Diagnosis
        if: failure()
        run: |
          set +e
          source $LOCAL_TOOLS
          cd ./sim
          echo "===== System ====="
          ulimit -a; getconf ARG_MAX; df -h . /tmp; free -m
          echo "/tmp entries: $(ls /tmp | wc -l), VSOU files: $(ls /tmp | grep -c VSOU)"
          echo "===== Resource samples (last 20) ====="
          tail -20 diag/resources.log
          echo "===== VUnit output ====="
          du -sh vunit_out/*
          ls -la vunit_out/modelsim
          wc -c vunit_out/modelsim/modelsim.ini vunit_out/modelsim/coverage_files.txt
          for lib in vunit_out/modelsim/libraries/*; do
            echo "$lib: $(ls $lib | wc -l) entries, $(ls $lib | grep -c opt) opt units, $(du -sh $lib | cut -f1)"
          done
          echo "===== Tests with E2BIG ====="
          grep -l "Argument list too long" vunit_out/test_output/*/output.txt > diag/e2big_tests.txt
          echo "Count: $(wc -l < diag/e2big_tests.txt) of $(ls vunit_out/test_output | wc -l) test outputs"
          head -20 diag/e2big_tests.txt
          echo "===== Order of E2BIG failures (by modification time) ====="
          ls -tr --full-time $(cat diag/e2big_tests.txt) | head -5
          FIRST=$(head -1 diag/e2big_tests.txt)
          if [ -n "$FIRST" ]; then
            cp "$FIRST" diag/first_e2big_output.txt
            echo "===== First E2BIG output: $FIRST ====="
            cat "$FIRST"
            # Rerun the failing test alone in the accumulated state (no strace, it breaks Questa)
            TEST=$(basename "$(dirname "$FIRST")" | sed 's/_[0-9a-f]\{40\}$//')
            echo "===== Rerun of $TEST ====="
            python3 -u ./run.py --modelsim --coverage "$TEST" > diag/rerun.txt 2>&1
            tail -30 diag/rerun.txt
          fi
      - name: Upload Diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2big-diagnosis
          path: |
            sim/diag/
            sim/vunit_out/modelsim/modelsim.ini
      # Coverage Simulation (check > 95%)
      # On PRs errors are required if coverage is low
      - name: Check Coverage Level
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          source $LOCAL_TOOLS
          cd ./sim
          python3 -u ./AnalyzeCoverage.py --min_coverage=95
      # Coverage Simulation (update badges)
      # On main, we want to udpate badges ALWAYS (also if coverage is low)
      - name: Create Coverage Badges
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: |
          source $LOCAL_TOOLS
          cd ./sim
          python3 -u ./AnalyzeCoverage.py --badges


  # Stopping the instance is not required (it stops automatically
  # when it is unused for some time, controlled by AWS alarm)